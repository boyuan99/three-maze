# Continuous integration on Windows, the rig's operating system (ADR-0001 follow-up).
#
#   javascript  Vitest unit tests (test/frontend) and the motion suite's fast tier
#               (test/motion/fast), TypeScript type check, renderer build
#   python      backend tests (test/backend) against the exact pins of requirements-dev.txt
#   motion-suite
#               the motion suite's full tier (test/motion, `npm run test:motion`): ADR-0001's CI
#               gate on every change to the motion module, the compiler or Rapier. It runs on every
#               event but tests only when a motion path changed, and otherwise passes, so it can be
#               a required check (see the job).
#   e2e         the hardware-free end-to-end bench (test/e2e): only when started by hand
#               (Actions > CI > Run workflow), because it takes several minutes and has not been
#               tried on a hosted runner yet. Hosted runners have no GPU, so the bench renders in
#               software (--software-gl), and runs with --ci (the sim self-test reports its tight
#               timing tolerances instead of asserting them on a shared runner).
#               The default scenarios are sim,s2,lifecycle. S1 is left out until phase 1 removes the
#               four known v0.3 data-logging defects (test/e2e/README.md, Known failures and Known
#               limits). With software rendering S1 reports two to four of them as KNOWN FAILURES,
#               which do not fail the job: the session-start backlog (8-9 samples without a row),
#               the low-frame-rate defect (3-28 % of the samples without a row, depending on the
#               frame rate) and the renderer's two losses (a sample at a reset, and samples
#               overwritten between frames: up to a fifth of them at 16 frames/s). A lost reward
#               is still a real failure (red): about 1 run in 3 at 25-26 frames/s on the
#               development machine (2026-10-08), none of 6 at 16 frames/s. So is any lost data row
#               or position_update outside these signatures.
#               Add s1 by hand in the input (for example sim,s1,s2,lifecycle) to see it.
#
# Actions are pinned to full commit SHAs; the comment gives the release tag.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e-scenarios:
        description: 'End-to-end scenarios (test/e2e/run.mjs --only), e.g. sim,s1,s2,lifecycle. Under software rendering s1 reports known v0.3 data-logging defects and sometimes fails on a lost reward (test/e2e/README.md)'
        required: false
        default: sim,s2,lifecycle

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript (Vitest, tsc, vite build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: these steps need no Python venv, which the postinstall would create
      # (the Electron binary is not downloaded by npm ci at all since Electron 42)
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  python:
    name: Python backend (pytest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  motion-suite:
    name: Motion suite (full tier, when motion paths change)
    runs-on: windows-latest
    # Three times the full tier's runtime on the development PC with one worker (5.6 min,
    # 2026-10-09, test/motion/README.md) plus about 5 min for checkout, setup and npm ci (estimate)
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the path filter compares with the base commit
      # The path filter runs here, not under on: paths. A required check whose workflow on: paths
      # skips stays pending and blocks the merge; this job always runs and passes when no motion
      # path changed. Paths: the motion module, the compiler, the suite, the dependency files
      # (Rapier) and this workflow. Without a base commit to compare with (manual run, new branch,
      # force push) the suite runs.
      - name: Check for changes to motion paths
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare with ($EVENT): running the motion suite"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- src/motion src/compiler test/motion \
            package.json package-lock.json .github/workflows/ci.yml)
          if [ -n "$changed" ]; then
            printf 'Motion paths changed since %s:\n%s\n' "$base" "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No motion path changed since $base: the motion suite is not needed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: the suite needs no Python venv (as in the javascript job)
      - if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.changes.outputs.run == 'true'
        run: npm run test:motion

  e2e:
    name: End-to-end bench (simulated rig, Electron, software rendering)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python first: npm ci's postinstall (setup/setup-python.js) creates .venv with `python`
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: npm ci (creates .venv)
        run: npm ci
      # Since Electron 42, npm ci no longer downloads the Electron binary
      - name: Download the Electron binary
        run: npx --no install-electron
      # The postinstall (setup/setup-python.js) already fails npm ci if the Python setup fails;
      # this step only confirms that the venv matches the pins
      - name: Check the venv
        run: .venv/Scripts/python -m pip install -r requirements-dev.txt
      # The output folder must not be on D:, where the runner keeps the workspace and its temp
      # folder (the simulated rig redirects D:\VirmenData); the user profile is on C:
      - name: Run the bench
        env:
          SCENARIOS: ${{ inputs.e2e-scenarios || 'sim,s2,lifecycle' }}
        run: |
          $out = Join-Path $env:USERPROFILE 'three-maze-e2e'
          "E2E_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          node test/e2e/run.mjs --software-gl --ci --only $env:SCENARIOS --out $out
      - name: Upload the bench output
        if: always() && env.E2E_OUT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: ${{ env.E2E_OUT }}
          if-no-files-found: ignore
          retention-days: 14
