; Python backend tests. Run from the repository root with the venv's interpreter:
;   .venv/Scripts/python -m pytest          (Windows; .venv/bin/python elsewhere)
; Dependencies: requirements-dev.txt. The JavaScript tests (test/frontend) and the end-to-end
; bench (test/e2e) have their own runners.
[pytest]
testpaths = test/backend
addopts = -ra --strict-markers
xfail_strict = true
; Dump every thread's stack if a test hangs, so a CI log shows where it stopped
faulthandler_timeout = 120
